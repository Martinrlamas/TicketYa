  /internal/events/{eventId}/cancellation:
    post:
      tags:
      - Internos
      summary: Notificar cancelación de evento (desde catalog)
      description: 'Idempotente por eventId. Expira órdenes pendientes y procesa reintegros automáticos en segundo plano.


        **Roles:** INTERNAL'
      operationId: post_internal_events_eventId_cancellation
      parameters:
      - name: eventId
        in: path
        required: true
        description: ID del evento
        schema:
          type: string
          format: uuid
        example: 9b2f6c1a-4d3e-4a7b-8c5d-2e1f0a9b8c7d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
            example:
              reason: Cancelado por el organizador
      security:
      - InternalToken: []
      x-internal: true
      responses:
        '202':
          description: Cancelación registrada; reintegros en proceso
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                    format: uuid
                  ordersExpired:
                    type: integer
                  itemsToRefund:
                    type: integer
              example:
                eventId: 9b2f6c1a-4d3e-4a7b-8c5d-2e1f0a9b8c7d
                ordersExpired: 3
                itemsToRefund: 100
        '200':
          description: Cancelación ya registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                    format: uuid
                  ordersExpired:
                    type: integer
                  itemsToRefund:
                    type: integer
              example:
                eventId: 9b2f6c1a-4d3e-4a7b-8c5d-2e1f0a9b8c7d
                ordersExpired: 3
                itemsToRefund: 100
        '403':
          description: Falta o es inválido X-Internal-Token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://ticketya.example/errors/forbidden
                title: Acceso denegado
                status: 403
                detail: X-Internal-Token ausente o inválido
                code: FORBIDDEN
                correlationId: b7d2c9e4-1f3a-4a5b-8c6d-7e8f9a0b1c2d
components:
  securitySchemes:
    UserId:
      type: apiKey
      in: header
      name: X-User-Id
      description: UUID del usuario (E1; en E2 se reemplaza por JWT Bearer)
    UserRole:
      type: apiKey
      in: header
      name: X-User-Role
      description: CUSTOMER | ORGANIZER | ADMIN | ACCESS_STAFF
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Secreto compartido entre servicios
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código de negocio estable
        correlationId:
          type: string
          format: uuid
