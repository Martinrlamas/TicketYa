        schema:
          type: string
        example: c1f4a7d2-9e3b-4a68-b5c1-2d7e8f90a1b3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  format: uuid
