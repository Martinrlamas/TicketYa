                    type: string
                    format: date-time
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId:
                          type: string
                          format: uuid
                        sectorId:
                          type: string
                          format: uuid
                        seatId:
                          type: string
                          format: uuid
                        seatLabel:
                          type: string
                        unitPrice:
                          type: number
                          format: double
                        currency:
                          type: string
                        status:
