  /api/tickets/{ticketId}:
    get:
      tags:
      - Entradas
      summary: Detalle de una entrada
      description: 'El CUSTOMER solo accede a sus entradas (404 si es ajena).


        **Roles:** CUSTOMER, ADMIN'
      operationId: get_api_tickets_ticketId
      parameters:
      - name: ticketId
        in: path
        required: true
        description: ID de la entrada
        schema:
          type: string
          format: uuid
        example: 6a708192-b3c4-46d7-a8e3-5e6f70819201
      security:
      - UserId: []
        UserRole: []
      responses:
        '200':
          description: Entrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketId:
                    type: string
                    format: uuid
                  orderItemId:
                    type: string
                    format: uuid
                  eventId:
                    type: string
                    format: uuid
                  sectorId:
                    type: string
                    format: uuid
                  seatId:
                    type: string
                    format: uuid
                  seatLabel:
                    type: string
                  qrCode:
                    type: string
                  status:
                    type: string
                  issuedAt:
                    type: string
                    format: date-time
              example:
                ticketId: 6a708192-b3c4-46d7-a8e3-5e6f70819201
