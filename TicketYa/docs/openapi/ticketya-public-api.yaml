  /api/orders:
    post:
      tags:
      - Compra
      summary: Crear orden y reservar lugares (paso 1 de la compra)
      description: 'Valida el evento (catalog), consume cuota por cliente (máx. 6 por evento, configurable), crea el hold
        en inventory y deja la orden en PENDING_PAYMENT. Numerado: `seatIds`. General: `quantity` (se generan N ítems). Idempotente
        por `Idempotency-Key`: mismo cuerpo → misma respuesta (200); otro cuerpo → 422.


        **Roles:** CUSTOMER'
