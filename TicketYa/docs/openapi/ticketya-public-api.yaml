                  city: Tandil
                  startsAt: '2027-03-20T21:00:00-03:00'
                  status: DRAFT
                  participants:
                  - name: Divididos
                    role: ARTIST
                  prices: []
                  minPrice: null
                  createdAt: '2026-11-07T15:30:00-03:00'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '401':
          description: Falta identidad o rol inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://ticketya.example/errors/unauthenticated
                title: No autenticado
                status: 401
                detail: Falta el header X-User-Id
                code: UNAUTHENTICATED
                correlationId: b7d2c9e4-1f3a-4a5b-8c6d-7e8f9a0b1c2d
        '403':
          description: Rol insuficiente o recurso de otro usuario
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://ticketya.example/errors/forbidden
                title: Acceso denegado
                status: 403
                detail: El rol CUSTOMER no puede invocar este endpoint
                code: FORBIDDEN
                correlationId: b7d2c9e4-1f3a-4a5b-8c6d-7e8f9a0b1c2d
  /api/events/{eventId}:
    get:
      tags:
      - Eventos
      summary: Detalle de evento
      description: 'Eventos PUBLISHED/SOLD_OUT son públicos. Los demás estados solo los ve el organizador dueño o un ADMIN;
        para el resto responde 404. No incluye disponibilidad.


        **Roles:** PUBLIC'
      operationId: get_api_events_eventId
      parameters:
      - name: eventId
        in: path
        required: true
        description: ID del evento
        schema:
          type: string
          format: uuid
        example: 9b2f6c1a-4d3e-4a7b-8c5d-2e1f0a9b8c7d
      security:
