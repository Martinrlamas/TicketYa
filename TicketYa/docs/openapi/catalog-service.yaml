          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://ticketya.example/errors/unauthenticated
                title: No autenticado
                status: 401
                detail: Falta el header X-User-Id
                code: UNAUTHENTICATED
                correlationId: b7d2c9e4-1f3a-4a5b-8c6d-7e8f9a0b1c2d
        '403':
          description: Rol insuficiente o recurso de otro usuario
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://ticketya.example/errors/forbidden
                title: Acceso denegado
                status: 403
                detail: El rol CUSTOMER no puede invocar este endpoint
                code: FORBIDDEN
                correlationId: b7d2c9e4-1f3a-4a5b-8c6d-7e8f9a0b1c2d
  /api/events/{eventId}:
    get:
      tags:
      - Eventos
      summary: Detalle de evento
      description: 'Eventos PUBLISHED/SOLD_OUT son públicos. Los demás estados solo los ve el organizador dueño o un ADMIN;
        para el resto responde 404. No incluye disponibilidad.


        **Roles:** PUBLIC'
      operationId: get_api_events_eventId
      parameters:
      - name: eventId
