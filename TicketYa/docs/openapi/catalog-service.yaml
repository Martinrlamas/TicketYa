components:
  securitySchemes:
    UserId:
      type: apiKey
      in: header
      name: X-User-Id
      description: UUID del usuario (E1; en E2 se reemplaza por JWT Bearer)
    UserRole:
      type: apiKey
      in: header
      name: X-User-Role
      description: CUSTOMER | ORGANIZER | ADMIN | ACCESS_STAFF
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Secreto compartido entre servicios
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código de negocio estable
        correlationId:
          type: string
          format: uuid
