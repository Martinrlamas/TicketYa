server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

payment:
  gateway: mock                      # adaptador activo del puerto PaymentGateway
  mock:
    timeout-simulation: PT10S        # cuánto duerme tok_timeout (debe superar el timeout del cliente de order-service)

springdoc:
  api-docs:
    path: /v3/api-docs
